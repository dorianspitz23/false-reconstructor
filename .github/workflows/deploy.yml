name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    # Deliberately not covered by the deploy concurrency group below. Guarding
    # the whole workflow meant a run of quick pushes cancelled the *tests* along
    # with the deploy, so only the last commit in a burst was ever checked and
    # a broken one in the middle would sail through unexamined.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      # Palette is authored in OKLCH, which says nothing about WCAG contrast.
      # This converts to sRGB luminance and fails the build if any text pair
      # drops below its threshold.
      - run: npm run check:contrast

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only one deploy in flight, and a newer commit supersedes an older one.
    # Pages allows a single concurrent deployment, so this has to stay — it just
    # belongs on the job that deploys rather than on the whole workflow.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A project site is served from /<repo>/, but attaching a custom domain
      # moves it to that domain's root. Setting a custom domain in the Pages UI
      # commits a CNAME file, so that file is the signal — without this, adding
      # a domain would silently 404 every asset.
      - id: base
        name: Work out where the site will be served from
        run: |
          if [ -f CNAME ]; then
            DOMAIN="$(tr -d '[:space:]' < CNAME)"
            echo "value=/"                     >> "$GITHUB_OUTPUT"
            echo "site=https://${DOMAIN}/"     >> "$GITHUB_OUTPUT"
            echo "Custom domain ${DOMAIN} — building for the domain root."
          else
            REPO="${{ github.event.repository.name }}"
            OWNER="${{ github.repository_owner }}"
            echo "value=/${REPO}/"                             >> "$GITHUB_OUTPUT"
            echo "site=https://${OWNER}.github.io/${REPO}/"    >> "$GITHUB_OUTPUT"
            echo "Project site — building for /${REPO}/."
          fi

      - run: npm run build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
          VITE_SITE_URL: ${{ steps.base.outputs.site }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
