name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    # Deliberately not covered by the deploy concurrency group below. Guarding
    # the whole workflow meant a run of quick pushes cancelled the *tests* along
    # with the deploy, so only the last commit in a burst was ever checked and
    # a broken one in the middle would sail through unexamined.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      # Palette is authored in OKLCH, which says nothing about WCAG contrast.
      # This converts to sRGB luminance and fails the build if any text pair
      # drops below its threshold.
      - run: npm run check:contrast

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only one deploy in flight, and a newer commit supersedes an older one.
    # Pages allows a single concurrent deployment, so this has to stay — it just
    # belongs on the job that deploys rather than on the whole workflow.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Pages serves the same repo from three different places, and each needs a
      # different asset base. Getting it wrong 404s every file while the build
      # still reports green, so this derives it rather than hardcoding it:
      #
      #   custom domain (CNAME present)   →  https://example.com/
      #   repo named <owner>.github.io    →  https://<owner>.github.io/
      #   anything else (a project site)  →  https://<owner>.github.io/<repo>/
      #
      # Setting a custom domain in the Pages UI commits the CNAME file, so that
      # file is the signal for the first case.
      - id: base
        name: Work out where the site will be served from
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          # Pages matches the owner-site repo name case-insensitively.
          LOWER_REPO="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          LOWER_OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"

          if [ -f CNAME ]; then
            DOMAIN="$(tr -d '[:space:]' < CNAME)"
            echo "value=/"                  >> "$GITHUB_OUTPUT"
            echo "site=https://${DOMAIN}/"  >> "$GITHUB_OUTPUT"
            echo "Custom domain ${DOMAIN} — building for the domain root."
          elif [ "$LOWER_REPO" = "${LOWER_OWNER}.github.io" ]; then
            echo "value=/"                          >> "$GITHUB_OUTPUT"
            echo "site=https://${LOWER_REPO}/"      >> "$GITHUB_OUTPUT"
            echo "Owner site — building for the root of ${LOWER_REPO}."
          else
            echo "value=/${REPO}/"                             >> "$GITHUB_OUTPUT"
            echo "site=https://${LOWER_OWNER}.github.io/${REPO}/" >> "$GITHUB_OUTPUT"
            echo "Project site — building for /${REPO}/."
          fi

      - run: npm run build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
          VITE_SITE_URL: ${{ steps.base.outputs.site }}
          # So the footer's source link follows the repo instead of naming an
          # owner who may since have renamed the account or moved it to an org.
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
